version: "3.9"

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: sap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sa_sap
      POSTGRES_PASSWORD: "Jq1v*lHHU_;sT+X^"
      POSTGRES_DB: shiftautoplanner
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa_sap -d shiftautoplanner"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${NEXT_PUBLIC_AZURE_AD_CLIENT_ID}
        NEXT_PUBLIC_AZURE_AD_TENANT_ID: ${NEXT_PUBLIC_AZURE_AD_TENANT_ID}
        NEXT_PUBLIC_AZURE_AD_REDIRECT_URI: ${NEXT_PUBLIC_AZURE_AD_REDIRECT_URI}

    image: sap-app:latest
    container_name: sap-app
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_AZURE_AD_CLIENT_ID=${NEXT_PUBLIC_AZURE_AD_CLIENT_ID}
      - NEXT_PUBLIC_AZURE_AD_TENANT_ID=${NEXT_PUBLIC_AZURE_AD_TENANT_ID}
      - NEXT_PUBLIC_AZURE_AD_REDIRECT_URI=${NEXT_PUBLIC_AZURE_AD_REDIRECT_URI}
      - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL}
      - AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET}
      - AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID}
      - MICROSOFT_GRAPH_REFRESH_TOKEN=${MICROSOFT_GRAPH_REFRESH_TOKEN}
      - CRON_SECRET=${CRON_SECRET}
    volumes:
      - ./backups:/app/backups
    networks:
      - sap-network

  nginx:
    image: nginx:stable
    container_name: sap-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/init-certs.sh:/docker-entrypoint.d/init-certs.sh:ro
      - nginx-certs:/etc/nginx/certs
    command: ["sh", "/docker-entrypoint.d/init-certs.sh"]
    networks:
      - sap-network

volumes:
  postgres-data:
  nginx-certs:

networks:
  sap-network:
    driver: bridge
